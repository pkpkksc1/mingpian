<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MingPin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="container py-4">
<h2>📇 MingPin</h2>
<div class="d-grid gap-2">
<button class="btn btn-primary" id="uploadBtn">📷 명함 촬영</button>
<button class="btn btn-secondary" id="listBtn">📂 명함 목록</button>
</div>
<div id="cards" class="mt-4"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<div class="mt-3 text-center">
<img id="preview" class="img-fluid rounded shadow" style="display:none;max-height:400px;">
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
